<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>2048</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: #0e0f13; color: #eee; font-family: system-ui, sans-serif; touch-action: none; }
  body { display: flex; flex-direction: column; align-items: center; padding: 16px; gap: 12px; }
  h1 { margin: 0; font-size: 32px; font-weight: 800; color: #f7c948; }
  .row { display: flex; gap: 12px; align-items: center; }
  .badge { background: #15171d; border: 1px solid #23262e; padding: 6px 12px; border-radius: 6px; font-size: 13px; }
  .badge b { color: #f7c948; }
  button { padding: 8px 14px; background: #2a2d36; border: 0; border-radius: 6px; color: #eee; cursor: pointer; font-size: 13px; }
  button:hover { background: #353944; }
  .board { display: grid; grid-template-columns: repeat(4, 80px); gap: 10px; background: #15171d; padding: 10px; border-radius: 10px; border: 1px solid #23262e; }
  @media (max-width: 420px) { .board { grid-template-columns: repeat(4, 70px); } .tile { width: 70px !important; height: 70px !important; font-size: 28px !important; } }
  .tile { width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 800; background: #23262e; border-radius: 6px; transition: transform .08s; }
  .tile[data-v="2"]    { background: #eee4da; color: #776e65; }
  .tile[data-v="4"]    { background: #ede0c8; color: #776e65; }
  .tile[data-v="8"]    { background: #f2b179; color: #fff; }
  .tile[data-v="16"]   { background: #f59563; color: #fff; }
  .tile[data-v="32"]   { background: #f67c5f; color: #fff; }
  .tile[data-v="64"]   { background: #f65e3b; color: #fff; }
  .tile[data-v="128"]  { background: #edcf72; color: #fff; font-size: 26px; }
  .tile[data-v="256"]  { background: #edcc61; color: #fff; font-size: 26px; }
  .tile[data-v="512"]  { background: #edc850; color: #fff; font-size: 26px; }
  .tile[data-v="1024"] { background: #edc53f; color: #fff; font-size: 22px; }
  .tile[data-v="2048"] { background: #edc22e; color: #fff; font-size: 22px; }
  .tile[data-v]:not([data-v="0"]) { animation: pop .12s ease; }
  @keyframes pop { 0% { transform: scale(.8); } 100% { transform: scale(1); } }
  .hint { font-size: 12px; color: #888; max-width: 360px; text-align: center; }
</style>
</head>
<body>
  <h1>2048</h1>
  <div class="row">
    <div class="badge">Score: <b id="score">0</b></div>
    <div class="badge">Best: <b id="best">0</b></div>
    <button onclick="reset()">New Game</button>
  </div>
  <div class="board" id="board"></div>
  <div class="hint">Arrow keys or WASD to move. Swipe on touch. Combine tiles to reach 2048.</div>

<script>
  const SIZE = 4;
  let grid, score, best = parseInt(localStorage.getItem("2048-best") || "0");

  function reset() {
    grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
    score = 0;
    addTile(); addTile();
    render();
  }

  function addTile() {
    const empty = [];
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++)
      if (grid[r][c] === 0) empty.push([r, c]);
    if (empty.length === 0) return;
    const [r, c] = empty[Math.floor(Math.random() * empty.length)];
    grid[r][c] = Math.random() < 0.9 ? 2 : 4;
  }

  function render() {
    const board = document.getElementById("board");
    board.innerHTML = "";
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
      const v = grid[r][c];
      const tile = document.createElement("div");
      tile.className = "tile";
      tile.dataset.v = v;
      tile.textContent = v || "";
      board.appendChild(tile);
    }
    document.getElementById("score").textContent = score;
    if (score > best) { best = score; localStorage.setItem("2048-best", best); }
    document.getElementById("best").textContent = best;
  }

  function slide(row) {
    const a = row.filter(x => x !== 0);
    for (let i = 0; i < a.length - 1; i++) {
      if (a[i] === a[i + 1]) { a[i] *= 2; score += a[i]; a.splice(i + 1, 1); }
    }
    while (a.length < SIZE) a.push(0);
    return a;
  }

  function move(dir) {
    const before = JSON.stringify(grid);
    if (dir === "left") {
      for (let r = 0; r < SIZE; r++) grid[r] = slide(grid[r]);
    } else if (dir === "right") {
      for (let r = 0; r < SIZE; r++) grid[r] = slide(grid[r].slice().reverse()).reverse();
    } else if (dir === "up") {
      for (let c = 0; c < SIZE; c++) {
        const col = slide(grid.map(r => r[c]));
        for (let r = 0; r < SIZE; r++) grid[r][c] = col[r];
      }
    } else if (dir === "down") {
      for (let c = 0; c < SIZE; c++) {
        const col = slide(grid.map(r => r[c]).reverse()).reverse();
        for (let r = 0; r < SIZE; r++) grid[r][c] = col[r];
      }
    }
    if (JSON.stringify(grid) !== before) {
      addTile();
      render();
      if (!canMove()) setTimeout(() => alert("Game over! Score: " + score), 80);
    }
  }

  function canMove() {
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
      if (grid[r][c] === 0) return true;
      if (c < SIZE - 1 && grid[r][c] === grid[r][c + 1]) return true;
      if (r < SIZE - 1 && grid[r][c] === grid[r + 1][c]) return true;
    }
    return false;
  }

  document.addEventListener("keydown", e => {
    const k = e.key.toLowerCase();
    const m = { arrowleft: "left", a: "left", arrowright: "right", d: "right",
                arrowup: "up", w: "up", arrowdown: "down", s: "down" }[k];
    if (m) { e.preventDefault(); move(m); }
  });

  let touch;
  document.addEventListener("touchstart", e => {
    touch = [e.touches[0].clientX, e.touches[0].clientY];
  }, { passive: true });
  document.addEventListener("touchend", e => {
    if (!touch) return;
    const dx = e.changedTouches[0].clientX - touch[0];
    const dy = e.changedTouches[0].clientY - touch[1];
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? "right" : "left");
    else move(dy > 0 ? "down" : "up");
    touch = null;
  });

  reset();
</script>
</body>
</html>
