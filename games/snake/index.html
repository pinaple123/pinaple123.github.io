<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Snake</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: #0e0f13; color: #eee; font-family: system-ui, sans-serif; touch-action: none; }
  body { display: flex; flex-direction: column; align-items: center; padding: 16px; gap: 12px; }
  h1 { margin: 0; font-size: 28px; font-weight: 800; color: #4ade80; }
  .row { display: flex; gap: 12px; align-items: center; }
  .badge { background: #15171d; border: 1px solid #23262e; padding: 6px 12px; border-radius: 6px; font-size: 13px; }
  .badge b { color: #4ade80; }
  button { padding: 8px 14px; background: #2a2d36; border: 0; border-radius: 6px; color: #eee; cursor: pointer; font-size: 13px; }
  button:hover { background: #353944; }
  canvas { background: #15171d; border: 1px solid #23262e; border-radius: 10px; image-rendering: pixelated; touch-action: none; max-width: 100%; }
  .hint { font-size: 12px; color: #888; max-width: 360px; text-align: center; }
</style>
</head>
<body>
  <h1>Snake</h1>
  <div class="row">
    <div class="badge">Score: <b id="score">0</b></div>
    <div class="badge">Best: <b id="best">0</b></div>
    <button onclick="reset()">New Game</button>
  </div>
  <canvas id="cv" width="400" height="400"></canvas>
  <div class="hint">Arrow keys or WASD to steer. Swipe on touch. Eat the red food, don't hit yourself.</div>

<script>
  const cv = document.getElementById("cv");
  const ctx = cv.getContext("2d");
  const CELL = 20;
  const W = cv.width / CELL;
  const H = cv.height / CELL;

  let snake, dir, nextDir, food, score, tick, dead, best = parseInt(localStorage.getItem("snake-best") || "0");

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 };
    nextDir = dir;
    placeFood();
    score = 0;
    dead = false;
    document.getElementById("score").textContent = 0;
    document.getElementById("best").textContent = best;
    if (!tick) tick = setInterval(step, 100);
  }

  function placeFood() {
    while (true) {
      const x = Math.floor(Math.random() * W);
      const y = Math.floor(Math.random() * H);
      if (!snake.some(s => s.x === x && s.y === y)) { food = { x, y }; return; }
    }
  }

  function step() {
    if (dead) return;
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.x >= W || head.y < 0 || head.y >= H ||
        snake.some(s => s.x === head.x && s.y === head.y)) {
      dead = true;
      if (score > best) { best = score; localStorage.setItem("snake-best", best); document.getElementById("best").textContent = best; }
      draw();
      return;
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      document.getElementById("score").textContent = score;
      placeFood();
    } else {
      snake.pop();
    }
    draw();
  }

  function draw() {
    ctx.fillStyle = "#15171d";
    ctx.fillRect(0, 0, cv.width, cv.height);

    ctx.fillStyle = "#ef4444";
    ctx.fillRect(food.x * CELL + 2, food.y * CELL + 2, CELL - 4, CELL - 4);

    for (let i = 0; i < snake.length; i++) {
      ctx.fillStyle = i === 0 ? "#4ade80" : "#22c55e";
      ctx.fillRect(snake[i].x * CELL + 1, snake[i].y * CELL + 1, CELL - 2, CELL - 2);
    }

    if (dead) {
      ctx.fillStyle = "rgba(0,0,0,0.6)";
      ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.fillStyle = "#fff";
      ctx.font = "bold 28px system-ui";
      ctx.textAlign = "center";
      ctx.fillText("Game Over", cv.width / 2, cv.height / 2 - 10);
      ctx.font = "14px system-ui";
      ctx.fillText("Score: " + score + " — click New Game", cv.width / 2, cv.height / 2 + 18);
    }
  }

  function setDir(x, y) {
    if (dir.x === -x && dir.y === -y) return;
    nextDir = { x, y };
  }

  document.addEventListener("keydown", e => {
    const k = e.key.toLowerCase();
    if (k === "arrowleft" || k === "a") setDir(-1, 0);
    else if (k === "arrowright" || k === "d") setDir(1, 0);
    else if (k === "arrowup" || k === "w") setDir(0, -1);
    else if (k === "arrowdown" || k === "s") setDir(0, 1);
    else return;
    e.preventDefault();
  });

  let touch;
  cv.addEventListener("touchstart", e => { touch = [e.touches[0].clientX, e.touches[0].clientY]; }, { passive: true });
  cv.addEventListener("touchend", e => {
    if (!touch) return;
    const dx = e.changedTouches[0].clientX - touch[0];
    const dy = e.changedTouches[0].clientY - touch[1];
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
    else setDir(0, dy > 0 ? 1 : -1);
    touch = null;
  });

  reset();
</script>
</body>
</html>
