<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Games</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: #0e0f13; color: #eee; font-family: system-ui, sans-serif; }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; background: #15171d; border-bottom: 1px solid #23262e;
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header input#search {
    flex: 1; max-width: 320px; padding: 8px 12px;
    background: #0e0f13; border: 1px solid #2a2d36; border-radius: 6px;
    color: #eee; font-size: 14px; outline: none;
  }
  header input#search:focus { border-color: #4a90e2; }
  header button {
    padding: 8px 14px; background: #2a2d36; border: 0; border-radius: 6px;
    color: #eee; cursor: pointer; font-size: 14px;
  }
  header button:hover { background: #353944; }
  header .btn-link {
    padding: 8px 14px; background: #4a90e2; color: #fff; text-decoration: none;
    border-radius: 6px; font-size: 14px; font-weight: 500;
  }
  header .btn-link:hover { background: #5aa3f0; }
  header .btn-link.disabled { background: #2a2d36; color: #777; pointer-events: none; cursor: not-allowed; }
  header .spacer { flex: 1; }
  header .who { font-size: 13px; color: #9aa; white-space: nowrap; }
  header .who b { color: #eee; }
  .btn-admin { background: #b8860b !important; color: #111 !important; font-weight: 600; }

  .grid {
    display: grid; gap: 14px; padding: 16px;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  }
  .card {
    background: #15171d; border: 1px solid #23262e; border-radius: 10px;
    overflow: hidden; cursor: pointer; transition: transform .12s, border-color .12s;
  }
  .card:hover { transform: translateY(-2px); border-color: #4a90e2; }
  .card .thumb {
    aspect-ratio: 16/10; background: #23262e center/cover no-repeat;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 700; color: #4a90e2;
  }
  .card .name { padding: 10px 12px; font-size: 14px; font-weight: 500; }

  #player {
    position: fixed; inset: 0; background: #000; z-index: 100;
    display: none; flex-direction: column;
  }
  #player.open { display: flex; }
  #player .bar {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 12px; background: #15171d; border-bottom: 1px solid #23262e;
  }
  #player .bar .title { flex: 1; font-size: 14px; font-weight: 500; }
  #player .bar button {
    padding: 6px 12px; background: #2a2d36; border: 0; border-radius: 6px;
    color: #eee; cursor: pointer; font-size: 13px;
  }
  #player .bar button:hover { background: #353944; }
  #player iframe { flex: 1; width: 100%; border: 0; background: #000; }

  /* ---- Auth gate ---- */
  #gate {
    position: fixed; inset: 0; z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(1200px 600px at 50% -10%, #1b2740, #0e0f13);
  }
  #gate.hidden { display: none; }
  .card-auth {
    width: 360px; max-width: calc(100vw - 32px);
    background: #15171d; border: 1px solid #23262e; border-radius: 14px;
    padding: 26px 24px; box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .card-auth h2 { margin: 0 0 4px; font-size: 22px; }
  .card-auth p.sub { margin: 0 0 18px; color: #8b93a3; font-size: 13px; }
  .card-auth label { display: block; font-size: 12px; color: #9aa; margin: 12px 0 5px; }
  .card-auth input {
    width: 100%; padding: 10px 12px; font-size: 14px;
    background: #0e0f13; border: 1px solid #2a2d36; border-radius: 8px; color: #eee; outline: none;
  }
  .card-auth input:focus { border-color: #4a90e2; }
  .card-auth .primary {
    width: 100%; margin-top: 18px; padding: 11px; font-size: 15px; font-weight: 600;
    background: #4a90e2; border: 0; border-radius: 8px; color: #fff; cursor: pointer;
  }
  .card-auth .primary:hover { background: #5aa3f0; }
  .card-auth .primary:disabled { opacity: .6; cursor: default; }
  .card-auth .toggle { margin-top: 14px; text-align: center; font-size: 13px; color: #8b93a3; }
  .card-auth .toggle a { color: #6aa8ee; cursor: pointer; text-decoration: none; }
  .card-auth .msg { margin-top: 12px; font-size: 13px; min-height: 16px; }
  .card-auth .msg.err { color: #ff6b6b; }
  .card-auth .msg.ok { color: #6bd28b; }
  .setup-note {
    margin-top: 16px; padding: 12px; border: 1px solid #5a3; border-radius: 8px;
    background: #0f1a12; color: #bfe; font-size: 12px; line-height: 1.5;
  }

  /* ---- Admin console ---- */
  #admin {
    position: fixed; inset: 0; z-index: 500; background: #0e0f13;
    display: none; flex-direction: column;
  }
  #admin.open { display: flex; }
  #admin .abar {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px;
    background: #15171d; border-bottom: 1px solid #23262e;
  }
  #admin .abar h2 { margin: 0; font-size: 17px; }
  #admin .abar .spacer { flex: 1; }
  #admin .wrap { flex: 1; overflow: auto; padding: 16px; }
  table.users { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.users th, table.users td { padding: 9px 10px; text-align: left; border-bottom: 1px solid #23262e; white-space: nowrap; }
  table.users th { color: #8b93a3; font-weight: 600; position: sticky; top: 0; background: #0e0f13; }
  table.users td.email { white-space: normal; word-break: break-all; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .dot.on { background: #3ddc84; box-shadow: 0 0 6px #3ddc84; }
  .dot.off { background: #555; }
  .pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
  .pill.admin { background: #4d3a00; color: #ffcf5a; }
  .pill.user { background: #1d2733; color: #8fb8ee; }
  .pill.banned { background: #3a1414; color: #ff8080; }
  table.users button {
    padding: 5px 9px; margin: 0 2px; font-size: 12px; border: 0; border-radius: 6px;
    cursor: pointer; background: #2a2d36; color: #eee;
  }
  table.users button:hover { filter: brightness(1.2); }
  button.b-toggle { background: #1d3a5f !important; }
  button.b-toggle.on { background: #1f6f3f !important; }
  button.b-ban { background: #6a2222 !important; }
  button.b-unban { background: #2a5a2a !important; }
  button.b-kick { background: #6a4a12 !important; }
  button.b-admin { background: #4a2a6a !important; }
  .muted { color: #8b93a3; }
</style>
</head>

<!-- ============ MAIN SITE (under the gate) ============ -->
<header>
  <h1>Games</h1>
  <input id="search" type="text" placeholder="Search…" autocomplete="off">
  <span class="spacer"></span>
  <a id="moreGames" class="btn-link disabled" href="https://pinaple123.github.io/aple.github.io/" target="_blank" rel="noopener" title="150+ more games">More Games ↗</a>
  <button onclick="cloak()" title="Open in about:blank">Cloak</button>
  <button id="adminBtn" class="btn-admin" style="display:none">Admin</button>
  <span class="who" id="who"></span>
  <button id="logoutBtn" style="display:none">Log out</button>
</header>

<div class="grid" id="grid"></div>

<div id="player">
  <div class="bar">
    <div class="title" id="playerTitle"></div>
    <button onclick="fs()">Fullscreen</button>
    <button onclick="closePlayer()">Close</button>
  </div>
  <iframe id="frame" allow="autoplay; fullscreen; gamepad; pointer-lock; cross-origin-isolated" allowfullscreen></iframe>
</div>

<!-- ============ ADMIN CONSOLE ============ -->
<div id="admin">
  <div class="abar">
    <h2>Admin console</h2>
    <span class="muted" id="adminCount"></span>
    <span class="spacer"></span>
    <button id="adminClose">Close</button>
  </div>
  <div class="wrap">
    <table class="users">
      <thead>
        <tr>
          <th>Status</th><th>Email</th><th>Role</th><th>Last seen</th>
          <th>2nd site</th><th>Actions</th>
        </tr>
      </thead>
      <tbody id="userRows"></tbody>
    </table>
  </div>
</div>

<!-- ============ AUTH GATE ============ -->
<div id="gate">
  <div class="card-auth">
    <h2 id="authTitle">Sign in</h2>
    <p class="sub">You need an account to use this site.</p>

    <div id="authForm">
      <label>Email</label>
      <input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com">
      <label>Password</label>
      <input id="authPass" type="password" autocomplete="current-password" placeholder="••••••••">
      <button class="primary" id="authSubmit">Sign in</button>
      <div class="toggle" id="authToggle">
        No account? <a id="toggleLink">Create one</a>
      </div>
      <div class="msg" id="authMsg"></div>
    </div>

    <div class="setup-note" id="setupNote" style="display:none"></div>
  </div>
</div>

  const grid = document.getElementById("grid");
  const search = document.getElementById("search");
  const player = document.getElementById("player");
  const frame = document.getElementById("frame");
  const playerTitle = document.getElementById("playerTitle");

  function render(filter = "") {
    const f = filter.trim().toLowerCase();
    grid.innerHTML = "";
    for (const g of GAMES) {
      if (f && !g.name.toLowerCase().includes(f)) continue;
      const card = document.createElement("div");
      card.className = "card";
      card.onclick = () => play(g);
      card.innerHTML = `
        <div class="thumb">${g.icon || g.name.split(" ").map(w => w[0]).slice(0,2).join("")}</div>
        <div class="name">${g.name}</div>
      `;
      grid.appendChild(card);
    }
  }

  function play(g) {
    playerTitle.textContent = g.name;
    frame.src = g.url ? g.url : `games/${g.path}/`;
    player.classList.add("open");
  }

  function closePlayer() {
    player.classList.remove("open");
    frame.src = "about:blank";
  }

  function fs() { if (frame.requestFullscreen) frame.requestFullscreen(); }

  function cloak() {
    const w = window.open("about:blank", "_blank");
    if (!w) { alert("Allow popups for this site."); return; }
    w.document.write(`<!DOCTYPE html><html><head><title>about:blank</title>
      <link rel="icon" href="data:,">
      <style>html,body,iframe{margin:0;padding:0;border:0;width:100vw;height:100vh;overflow:hidden;}</style>
      </head><body><iframe src="${location.href}" allowfullscreen allow="autoplay; fullscreen; gamepad; pointer-lock"></iframe></body></html>`);
    w.document.close();
  }

  // expose inline-handler functions
  window.cloak = cloak; window.fs = fs; window.closePlayer = closePlayer;

  search.oninput = e => render(e.target.value);
  document.addEventListener("keydown", e => { if (e.key === "Escape") closePlayer(); });

  render();
</script>

</body>
</html>
