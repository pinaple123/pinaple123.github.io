<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Games</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: #0e0f13; color: #eee; font-family: system-ui, sans-serif; }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; background: #15171d; border-bottom: 1px solid #23262e;
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header input {
    flex: 1; max-width: 320px; padding: 8px 12px;
    background: #0e0f13; border: 1px solid #2a2d36; border-radius: 6px;
    color: #eee; font-size: 14px; outline: none;
  }
  header input:focus { border-color: #4a90e2; }
  header button {
    padding: 8px 14px; background: #2a2d36; border: 0; border-radius: 6px;
    color: #eee; cursor: pointer; font-size: 14px;
  }
  header button:hover { background: #353944; }

  .grid {
    display: grid; gap: 14px; padding: 16px;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  }
  .card {
    background: #15171d; border: 1px solid #23262e; border-radius: 10px;
    overflow: hidden; cursor: pointer; transition: transform .12s, border-color .12s;
  }
  .card:hover { transform: translateY(-2px); border-color: #4a90e2; }
  .card .thumb {
    aspect-ratio: 16/10; background: #23262e center/cover no-repeat;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 700; color: #4a90e2;
  }
  .card .name {
    padding: 10px 12px; font-size: 14px; font-weight: 500;
  }

  #player {
    position: fixed; inset: 0; background: #000; z-index: 100;
    display: none; flex-direction: column;
  }
  #player.open { display: flex; }
  #player .bar {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 12px; background: #15171d; border-bottom: 1px solid #23262e;
  }
  #player .bar .title { flex: 1; font-size: 14px; font-weight: 500; }
  #player .bar button {
    padding: 6px 12px; background: #2a2d36; border: 0; border-radius: 6px;
    color: #eee; cursor: pointer; font-size: 13px;
  }
  #player .bar button:hover { background: #353944; }
  #player iframe { flex: 1; width: 100%; border: 0; background: #000; }
</style>
</head>
<body>

<header>
  <h1>Games</h1>
  <input id="search" type="text" placeholder="Search…" autocomplete="off">
  <button onclick="cloak()" title="Open in about:blank">Cloak</button>
</header>

<div class="grid" id="grid"></div>

<div id="player">
  <div class="bar">
    <div class="title" id="playerTitle"></div>
    <button onclick="fs()">Fullscreen</button>
    <button onclick="closePlayer()">Close</button>
  </div>
  <iframe id="frame" allow="autoplay; fullscreen; gamepad; pointer-lock; cross-origin-isolated" allowfullscreen></iframe>
</div>

<script>
  // GameDistribution allows third-party iframe embedding (verified: no X-Frame-Options, no CSP frame-ancestors).
  // URL format: https://html5.gamedistribution.com/<id>/
  // CrazyGames was removed because they now block embedding (401 + SAMEORIGIN).
  const GAMES = [
    { id: "5b0abd4c0faa4f5eb190a9a16d5a1b4c", name: "Moto X3M" },
    { id: "f804d079d19f44d3b951ead4588e974a", name: "Moto X3M Pool Party" },
    { id: "f6c198ea49464c2ebe2558c89d1e1ee1", name: "Drift Cars" },
    { id: "647536adcfa040668029eae70c72ce33", name: "Tetris" },
    { id: "2dee9d404697435aa76111eb4015e1d5", name: "Merge Fruit" },
    { id: "27673bc45d2e4b27b7cd24e422f7c257", name: "Bubble Game 3" },
    { id: "46e4207f29ca4de1affc5596be40f7f0", name: "Microsoft Mahjong" },
    { id: "134db518698b45bc80e27e466b14345b", name: "Checkers" },
    { id: "20fa5406b00643128250478502fa5453", name: "8 Ball Pro" },
    { id: "587cc8f8b84b484f9267a7ec1caa5328", name: "Pool 8 Ball" },
    { id: "5599daed64d9456992f9029945544e1d", name: "3D Billiard 8 Ball Pool" },
    { id: "d02120780e594158ab61869028223cf1", name: "Arkadium 8 Ball Pool" },
    { id: "c812b37e92cc419a87c00e3d33a90e33", name: "Classic Car Parking 3D" },
    { id: "55687da035f245aeb3945e358fb3fd59", name: "Real Car Parking" },
    { id: "0418077834c04165806f432b5d4b2117", name: "Moto Bike Racing 3D" },
    { id: "61b7b8e7e9414c80997a2e72190407d2", name: "2 Player Battle Car Racing" },
    { id: "347d3d5f72aa46e9bdd88052351a6d85", name: "Extreme Bike Race" },
    { id: "8baa45aabd504c1ab7a6c4ee9b1a336f", name: "EG Bus Subway" },
    { id: "6729f660517a479ab2edf32d4665800e", name: "Stickman Shooter" },
    { id: "d293147adac449bd9e4d8f5934f8252e", name: "Stickman Shooter 2" },
    { id: "b2626cb4ee884e8881b2420f6fbf4107", name: "Counter Terror Shooter" },
    { id: "1d7959f081b4453498ee9916b693988c", name: "Stick Duel Battle" },
    { id: "7f27295d85f24a16b0a9eb5df0f94fb1", name: "Tower Defense 2D" },
    { id: "77e1107ca4be4fdfb62b498d014bbfa7", name: "Tower Defense" },
    { id: "d4ac0ead7ff5403eb3aa6ab620b0b959", name: "Gold Tower Defense" },
    { id: "c87a32902f7f486bbd639514cfa5cb58", name: "Zombie Idle Defense" },
  ];

  const grid = document.getElementById("grid");
  const search = document.getElementById("search");
  const player = document.getElementById("player");
  const frame = document.getElementById("frame");
  const playerTitle = document.getElementById("playerTitle");

  function render(filter = "") {
    const f = filter.trim().toLowerCase();
    grid.innerHTML = "";
    for (const g of GAMES) {
      if (f && !g.name.toLowerCase().includes(f)) continue;
      const card = document.createElement("div");
      card.className = "card";
      card.onclick = () => play(g);
      card.innerHTML = `
        <div class="thumb">${g.name.split(" ").map(w => w[0]).slice(0,2).join("")}</div>
        <div class="name">${g.name}</div>
      `;
      grid.appendChild(card);
    }
  }

  function play(g) {
    playerTitle.textContent = g.name;
    frame.src = `https://html5.gamedistribution.com/${g.id}/`;
    player.classList.add("open");
  }

  function closePlayer() {
    player.classList.remove("open");
    frame.src = "about:blank";
  }

  function fs() {
    if (frame.requestFullscreen) frame.requestFullscreen();
  }

  function cloak() {
    const w = window.open("about:blank", "_blank");
    if (!w) { alert("Allow popups for this site."); return; }
    w.document.write(`<!DOCTYPE html><html><head><title>about:blank</title>
      <link rel="icon" href="data:,">
      <style>html,body,iframe{margin:0;padding:0;border:0;width:100vw;height:100vh;overflow:hidden;}</style>
      </head><body><iframe src="${location.href}" allowfullscreen allow="autoplay; fullscreen; gamepad; pointer-lock"></iframe></body></html>`);
    w.document.close();
  }

  search.oninput = e => render(e.target.value);
  document.addEventListener("keydown", e => { if (e.key === "Escape") closePlayer(); });

  render();
</script>

</body>
</html>
